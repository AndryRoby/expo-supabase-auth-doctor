<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found: Redirect Doctor</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="./favicon.ico" />
<style>
  :root {
    --paper:#f6f2ea; --paper-2:#fbf9f4; --ink:#1b1a17; --ink-2:#4a4741; --muted:#66625a; --line:#d9d2c4;
    --accent:#b23a1d;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#151412; --paper-2:#1d1b18; --ink:#efe9de; --ink-2:#c9c2b5; --muted:#8f887b; --line:#2e2b26; --accent:#e0623f; }
  }
  * { box-sizing:border-box; }
  html { background:var(--paper); }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    color:var(--ink); background:var(--paper); font:16px/1.55 var(--sans); -webkit-font-smoothing:antialiased;
  }
  a { color:inherit; text-decoration-color:var(--line); text-underline-offset:3px; }
  a:hover { text-decoration-color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .card { max-width:480px; width:100%; border:1px solid var(--line); background:var(--paper-2); border-radius:4px; padding:36px 32px; text-align:center; }
  .wordmark { display:inline-block; font:600 20px/1 var(--serif); margin-bottom:22px; text-decoration:none; }
  .code404 { font:12.5px/1 var(--mono); color:var(--muted); letter-spacing:.04em; margin:0 0 12px; }
  h1 { font:400 clamp(22px,4vw,28px)/1.2 var(--serif); letter-spacing:-.01em; margin:0 0 12px; }
  p.sub { color:var(--ink-2); font-size:15px; margin:0 0 26px; }
  .btn { display:inline-block; font:600 15px/1 var(--sans); padding:12px 18px; border-radius:4px; text-decoration:none; background:var(--accent); color:#fff; }
</style>
</head>
<body>
  <div class="card">
    <a class="wordmark" href="./">Redirect Doctor</a>
    <p class="code404">404</p>
    <h1>This page doesn't exist.</h1>
    <p class="sub">The redirect you followed didn't match anything here either. Head back and paste your config instead.</p>
    <a class="btn" href="./">Back to Redirect Doctor</a>
  </div>
</body>
</html>
